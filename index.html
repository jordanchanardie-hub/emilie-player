<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Spotify Émilie</title>
<style>
body { font-family: Arial; padding: 20px; }
button { display: block; width: 100%; max-width: 400px; padding: 20px; margin: 15px 0; font-size: 20px; }
pre { background: #eee; padding: 10px; white-space: pre-wrap; }
</style>
</head>
<body>

<button onclick="loginSpotify()">Connexion Spotify</button>
<button onclick="voirAppareils()">Voir appareils disponibles</button>
<button onclick="lancerPlaylist()">Lancer playlist test</button>
<button onclick="pauseSpotify()">Pause</button>

<pre id="log"></pre>

<script>
const CLIENT_ID = "cdfba9cd42fe48aea5e54607344126c6";
const REDIRECT_URI = "https://jordanchanardie-hub.github.io/emilie-player/";
const SCOPES = "user-read-playback-state user-modify-playback-state";

const PLAYLIST_URI = "spotify:playlist:1nnvLTbypOmQapCY24vBuv";

function log(message) {
    document.getElementById("log").textContent += message + "\n";
}

function randomString(length) {
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    let result = "";
    for (let i = 0; i < length; i++) result += chars.charAt(Math.floor(Math.random() * chars.length));
    return result;
}

async function sha256(plain) {
    const encoder = new TextEncoder();
    const data = encoder.encode(plain);
    return await crypto.subtle.digest("SHA-256", data);
}

function base64urlencode(buffer) {
    return btoa(String.fromCharCode(...new Uint8Array(buffer)))
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/, "");
}

async function loginSpotify() {
    const verifier = randomString(64);
    localStorage.setItem("code_verifier", verifier);

    const challenge = base64urlencode(await sha256(verifier));

    const params = new URLSearchParams({
        response_type: "code",
        client_id: CLIENT_ID,
        scope: SCOPES,
        redirect_uri: REDIRECT_URI,
        code_challenge_method: "S256",
        code_challenge: challenge
    });

    window.location = "https://accounts.spotify.com/authorize?" + params.toString();
}

async function getToken() {
    let token = localStorage.getItem("access_token");
    if (token) return token;

    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");

    if (!code) {
        log("Pas encore connecté à Spotify.");
        return null;
    }

    const verifier = localStorage.getItem("code_verifier");

    const body = new URLSearchParams({
        client_id: CLIENT_ID,
        grant_type: "authorization_code",
        code: code,
        redirect_uri: REDIRECT_URI,
        code_verifier: verifier
    });

    const response = await fetch("https://accounts.spotify.com/api/token", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: body
    });

    const data = await response.json();

    if (data.access_token) {
        localStorage.setItem("access_token", data.access_token);
        log("Connexion Spotify OK.");
        window.history.replaceState({}, document.title, REDIRECT_URI);
        return data.access_token;
    } else {
        log("Erreur token : " + JSON.stringify(data));
        return null;
    }
}

async function voirAppareils() {
    const token = await getToken();
    if (!token) return;

    const response = await fetch("https://api.spotify.com/v1/me/player/devices", {
        headers: { Authorization: "Bearer " + token }
    });

    const data = await response.json();
    log("Appareils disponibles :");
    log(JSON.stringify(data, null, 2));
}

async function lancerPlaylist() {
    const token = await getToken();
    if (!token) return;

    const response = await fetch("https://api.spotify.com/v1/me/player/play", {
        method: "PUT",
        headers: {
            Authorization: "Bearer " + token,
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            context_uri: PLAYLIST_URI
        })
    });

    log("Commande lecture envoyée. Statut : " + response.status);
}

async function pauseSpotify() {
    const token = await getToken();
    if (!token) return;

    const response = await fetch("https://api.spotify.com/v1/me/player/pause", {
        method: "PUT",
        headers: { Authorization: "Bearer " + token }
    });

    log("Commande pause envoyée. Statut : " + response.status);
}

getToken();
</script>

</body>
</html>
