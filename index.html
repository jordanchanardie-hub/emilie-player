<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>Émilie Player</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #ffffff;
    font-family: Arial, sans-serif;
}

.grille {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 20px;
    max-width: 900px;
    margin: 20px auto;
}

.carte {
    border: 0;
    background: none;
    padding: 0;
    cursor: pointer;
}

.carte img {
    width: 100%;
    border-radius: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.18);
}

.carte:active {
    transform: scale(0.96);
}

.actions {
    max-width: 900px;
    margin: 0 auto 20px auto;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
}

.btn-discret {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 0;
    background: #f1f1f1;
    font-size: 22px;
    cursor: pointer;
}

.btn-pause {
    width: 120px;
    height: 70px;
    border-radius: 999px;
    border: 0;
    background: #1DB954;
    color: white;
    font-size: 34px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 6px 14px rgba(0,0,0,0.18);
}

.btn-pause:active,
.btn-discret:active {
    transform: scale(0.94);
}

.actions button {
    width: 100%;
    padding: 18px;
    font-size: 20px;
    margin-bottom: 12px;
}

.fallback-carte {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 24px;
    background: #f1f1f1;
    box-shadow: 0 8px 20px rgba(0,0,0,0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 16px;
    font-size: 20px;
    font-weight: bold;
}

pre {
    background: #eee;
    padding: 10px;
    white-space: pre-wrap;
    max-width: 900px;
    margin: 20px auto;
}
</style>
</head>

<body>

<div class="actions">
    <button class="btn-discret" onclick="resetSpotify()" title="Connexion Spotify">♫</button>

    <button class="btn-pause" onclick="pauseSpotify()" title="Pause">
        ⏸
    </button>

    <button class="btn-discret" onclick="voirAppareils()" title="Voir appareils disponibles">
        ?
    </button>
    
</div>

<div id="grille" class="grille"></div>

<pre id="log"></pre>

<script>
const CLIENT_ID = "cdfba9cd42fe48aea5e54607344126c6";
const REDIRECT_URI = "https://jordanchanardie-hub.github.io/emilie-player/";
const SCOPES = "user-read-playback-state user-modify-playback-state";

const contenus = [
    {
        titre: "Lapin de Paques",
        type: "playlist",
        id: "1nnvLTbypOmQapCY24vBuv"
    },
    {
        titre: "Lilo et Stitch",
        type: "album",
        id: "2h3G3hfzOhry00pMLoKXTr"
    },
    {
        titre: "Le Roi Lion",
        type: "album",
        id: "3ICNogb1Dkvx1an0469H3f"
    },
    {
        titre: "La Reine des Neiges",
        type: "show",
        id: "2pht96pLK07y4xxnHjiXs6"
    },
    {
        titre: "Blanche Neige",
        type: "show",
        id: "5Td2oKWIv1UzeQpExdT4RN"
    },
    {
        titre: "La Petite Sirène",
        type: "album",
        id: "7pYIWTbQnzflppdNIDKhbm"
    },
    {
        titre: "Aldebert - 10 ans d'enfantillage",
        type: "album",
        id: "20yuAjZhTVhDHcYx6dep1w"
    },
    {
        titre: "Enfantillage",
        type: "album",
        id: "1xhy7WWxO28XoPKuFlnxSZ"
    },
    {
        titre: "Raiponce",
        type: "show",
        id: "0ZvpmGEQTpfuOwHAer95Ut"
    },
    {
        titre: "test",
        type: "playlist",
        id: "3pCTfaiUTk7TzFXSWBBNtC"
    }     
];

function log(message) {
    document.getElementById("log").textContent += message + "\n";
}

function randomString(length) {
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    let result = "";
    for (let i = 0; i < length; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return result;
}

async function sha256(plain) {
    const encoder = new TextEncoder();
    const data = encoder.encode(plain);
    return await crypto.subtle.digest("SHA-256", data);
}

function base64urlencode(buffer) {
    return btoa(String.fromCharCode(...new Uint8Array(buffer)))
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/, "");
}

async function loginSpotify() {
    const verifier = randomString(64);
    localStorage.setItem("code_verifier", verifier);

    const challenge = base64urlencode(await sha256(verifier));

    const params = new URLSearchParams({
        response_type: "code",
        client_id: CLIENT_ID,
        scope: SCOPES,
        redirect_uri: REDIRECT_URI,
        code_challenge_method: "S256",
        code_challenge: challenge
    });

    window.location.href = "https://accounts.spotify.com/authorize?" + params.toString();
}
async function getToken() {
    let token = localStorage.getItem("access_token");
    if (token) return token;

    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");

    if (!code) {
        log("Pas encore connecté à Spotify.");
        return null;
    }

    const verifier = localStorage.getItem("code_verifier");

    const body = new URLSearchParams({
        client_id: CLIENT_ID,
        grant_type: "authorization_code",
        code: code,
        redirect_uri: REDIRECT_URI,
        code_verifier: verifier
    });

    const response = await fetch("https://accounts.spotify.com/api/token", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: body
    });

    const data = await response.json();

    if (data.access_token) {
        localStorage.setItem("access_token", data.access_token);
        log("Connexion Spotify OK.");
        window.history.replaceState({}, document.title, REDIRECT_URI);
        return data.access_token;
    } else {
        log("Erreur token : " + JSON.stringify(data));
        return null;
    }
}

async function voirAppareils() {
    const token = await getToken();
    if (!token) return;

    const response = await fetch("https://api.spotify.com/v1/me/player/devices", {
        headers: { Authorization: "Bearer " + token }
    });

    const data = await response.json();
    log("Appareils disponibles :");
    log(JSON.stringify(data, null, 2));
}

async function recupererImage(type, id, token) {
    const response = await fetch(`https://api.spotify.com/v1/${type}s/${id}`, {
        headers: { Authorization: "Bearer " + token }
    });

    if (response.status === 429) {
        log("Trop d'appels Spotify. Attends quelques secondes puis recharge la page.");
        return null;
    }

    if (response.status === 401) {
        localStorage.removeItem("access_token");
        log("Session Spotify expirée. Clique à nouveau sur ♫.");
        return null;
    }

    const data = await response.json();

    if (!response.ok) {
        log("Erreur image Spotify : " + JSON.stringify(data));
        return null;
    }

    return data.images?.[0]?.url || null;
}
    
function resetSpotify() {
    localStorage.removeItem("access_token");
    localStorage.removeItem("code_verifier");
    loginSpotify();
}

async function getDeviceIdCible() {
    const token = await getToken();
    if (!token) return null;

    const nomAppareilCible = "B3-A40FHD";

    const response = await fetch("https://api.spotify.com/v1/me/player/devices", {
        headers: { Authorization: "Bearer " + token }
    });

    const data = await response.json();

    if (!data.devices || data.devices.length === 0) {
        log("Aucun appareil Spotify disponible. Ouvre Spotify sur B3-A40FHD, lance une musique, puis reviens ici.");
        return null;
    }

    const cible = data.devices.find(device => device.name === nomAppareilCible);

    if (!cible) {
        log("Appareil B3-A40FHD introuvable.");
        log("Appareils disponibles : " + data.devices.map(d => d.name).join(", "));
        return null;
    }

    log("Appareil cible trouvé : " + cible.name);
    return cible.id;
}
async function lancerLecture(type, id) {
    const token = await getToken();
    if (!token) return;

    const deviceId = await getDeviceIdCible();
    if (!deviceId) return;

    const uri = `spotify:${type}:${id}`;

    const body = {
        context_uri: uri,
        offset: { position: 0 },
        position_ms: 0
    };

    const response = await fetch(
        `https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`,
        {
            method: "PUT",
            headers: {
                Authorization: "Bearer " + token,
                "Content-Type": "application/json"
            },
            body: JSON.stringify(body)
        }
    );

    log("Lecture : " + uri + " / statut " + response.status);
}
    
async function pauseSpotify() {
    const token = await getToken();
    if (!token) return;

    const response = await fetch("https://api.spotify.com/v1/me/player/pause", {
        method: "PUT",
        headers: { Authorization: "Bearer " + token }
    });

    log("Pause / statut " + response.status);
}

async function afficherContenus() {
    const token = await getToken();
    if (!token) return;

    const grille = document.getElementById("grille");
    grille.innerHTML = "";

    for (const item of contenus) {
        const bouton = document.createElement("button");
        bouton.className = "carte";
        bouton.onclick = () => lancerLecture(item.type, item.id);

        try {
            const imageUrl = await recupererImage(item.type, item.id, token);

            if (imageUrl) {
                bouton.innerHTML = `
                    <img src="${imageUrl}" alt="${item.titre}">
                `;
            } else {
                bouton.innerHTML = `
                    <div class="fallback-carte">${item.titre}</div>
                `;
            }
        } catch (error) {
            bouton.innerHTML = `
                <div class="fallback-carte">${item.titre}</div>
            `;
            log("Erreur affichage " + item.titre + " : " + error.message);
        }

        grille.appendChild(bouton);
        await attendre(250);
    }
}
getToken().then((token) => {
    if (token) afficherContenus();
});

function attendre(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}
</script>

</body>
</html>
